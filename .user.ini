; ─────────────────────────────────────────────────────────────────────────────
; Colegio Bilbao — límites de PHP en hosting compartido (Hostinger)
;
; En Hostinger no hay acceso al php.ini global, así que los valores que la
; aplicación necesita van aquí (PHP-FPM lee .user.ini por directorio).
; En IIS estos mismos valores se ponían a mano en php.ini + web.config.
;
; ⚠️ Los tres primeros los EXIGE Suplencia::MAX_JUSTIFICANTE_MB = 50. Con los
; defaults de PHP (2M/8M) el archivo llega vacío; subirJustificante() detecta
; UPLOAD_ERR_INI_SIZE y lo explica, pero la subida no ocurre.
;
; post_max_size va por encima de upload_max_filesize a propósito: el POST lleva
; el archivo MÁS los campos del formulario.
; ─────────────────────────────────────────────────────────────────────────────

upload_max_filesize = 52M
post_max_size = 56M
memory_limit = 256M

; La importación de horarios por CSV es el consumidor: reemplaza semanas
; enteras en una sola transacción.
max_execution_time = 120

; includes/app.php ya lo fija en runtime; esto solo evita el warning de PHP
; cuando algo lee una fecha antes del bootstrap.
date.timezone = "America/Mexico_City"
